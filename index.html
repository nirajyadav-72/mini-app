<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Game Mini App</title>
    <!-- CSS फ़ाइल को लिंक करना -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <h1>🎲 प्रिमियम क्विज़ गेम</h1>
            <p class="subtitle">अपनी तैयारी को परखें और स्कोर सुधारें!</p>
            <div class="emoji-banner">🏆</div>
            <button class="btn" id="start-btn">क्विज़ शुरू करें</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-counter">प्रश्न: 1/5</span>
                <span class="timer">⏰ <span id="time-left">15</span>s</span>
            </div>
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div id="question-text" class="question-text">प्रश्न यहाँ लोड होगा...</div>
            
            <ul id="options-list" class="options-list">
                <!-- ऑप्शंस जावास्क्रिप्ट से डायनेमिकली आएंगे -->
            </ul>

            <div id="explanation-box" class="explanation-box"></div>

            <button id="next-btn" class="btn" style="display: none;">अगला प्रश्न ➡️</button>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen">
            <h1>🏁 क्विज़ समाप्त!</h1>
            <p class="subtitle">यहाँ आपका अंतिम परिणाम है</p>
            
            <div id="result-score" class="result-score">0/5</div>
            
            <div class="stat-box">
                <div class="stat-item">
                    <span>सही जवाब</span>
                    <strong id="stat-correct" class="text-success">0</strong>
                </div>
                <div class="stat-item">
                    <span>गलत जवाब</span>
                    <strong id="stat-wrong" class="text-error">0</strong>
                </div>
            </div>

            <button class="btn" id="restart-btn">फिर से खेलें ✨</button>
        </div>

    </div>

    <!-- जावास्क्रिप्ट फ़ाइल को मॉड्यूल के रूप में लिंक करना ताकि इम्पोर्ट काम करे -->
    <script type="module" src="script.js"></script>
</body>
</html>
