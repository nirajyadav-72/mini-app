<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Game Mini App</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">

    <div class="quiz-container">
        
        <!-- TOP CONTROL MENU -->
        <div class="top-bar">
            <div class="user-pill" id="user-pill">
                <img src="https://liara.run" id="user-avatar" alt="DP">
                <span id="user-display-name">Loading...</span>
            </div>
            <button class="settings-btn" id="theme-trigger-btn">🎨</button>
        </div>

        <!-- THEME INTERACTIVE OVERLAY POPUP -->
        <div class="theme-overlay" id="theme-overlay">
            <div class="theme-modal">
                <h3>Choose Your Theme 🎨</h3>
                <div class="theme-grid">
                    <button class="theme-opt-btn" data-theme="theme-light-blue">Light Blue</button>
                    <button class="theme-opt-btn data-active" data-theme="theme-dark">Dark Mode</button>
                    <button class="theme-opt-btn" data-theme="theme-green">Green</button>
                    <button class="theme-opt-btn" data-theme="theme-purple">Purple</button>
                    <button class="theme-opt-btn" data-theme="theme-ocean">Ocean</button>
                </div>
                <button class="btn close-modal-btn" id="theme-close-btn">Close</button>
            </div>
        </div>

        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <h1>🎲 प्रिमियम क्विज़ गेम</h1>
            <p class="subtitle">अपनी तैयारी को परखें और स्कोर सुधारें!</p>
            <div class="emoji-banner">🏆</div>
            
            <div class="profile-card">
                <h4>👤 Player Statistics</h4>
                <p>🪪 ID: <span id="meta-user-id">--------</span></p>
                <p>🌐 Language: <span id="meta-user-lang">Hindi</span></p>
            </div>

            <button class="btn" id="start-btn">क्विज़ शुरू करें</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-counter">प्रश्न: 1/5</span>
                <span class="timer">⏰ <span id="time-left">15</span>s</span>
            </div>
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div id="question-text" class="question-text">प्रश्न यहाँ लोड होगा...</div>
            
            <ul id="options-list" class="options-list">
                <!-- Javascript handles option injection here -->
            </ul>

            <div id="explanation-box" class="explanation-box"></div>

            <button id="next-btn" class="btn" style="display: none;">अगला प्रश्न ➡️</button>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen">
            <h1>🏁 क्विज़ समाप्त!</h1>
            <p class="subtitle">बधाई हो <span id="result-user-name" style="color: #a5b4fc; font-weight: bold;">Player</span>, यहाँ आपका अंतिम परिणाम है</p>
            
            <div id="result-score" class="result-score">0/5</div>
            
            <div class="stat-box">
                <div class="stat-item">
                    <span>सही जवाब</span>
                    <strong id="stat-correct" class="text-success">0</strong>
                </div>
                <div class="stat-item">
                    <span>गलत जवाब</span>
                    <strong id="stat-wrong" class="text-error">0</strong>
                </div>
            </div>

            <button class="btn" id="restart-btn">फिर से खेलें ✨</button>
        </div>

    </div>

    <!-- Telegram JavaScript SDK Link -->
    <script src="https://telegram.org"></script>
    <!-- Application Logic Entrypoint Link -->
    <script type="module" src="script.js"></script>
</body>
</html>
